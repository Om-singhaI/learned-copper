[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-copper"
version = "0.1.0"
description = "Guiding PCB autorouting with a model trained on human routed boards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Om Singhal", email = "wengsinghal@gmail.com" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "datasets",
    "huggingface_hub",
    "kiutils",
    "scikit-learn",
    "lightgbm",
    "torch",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
